<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    >

    <meta name="theme-color" content="#090b13">

    <meta
        name="description"
        content="GAMEReP — 2D story-driven platformer about music, friendship and chasing a dream."
    >

    <title>GAMEReP</title>

    <!-- =========================
         STYLES
    ========================== -->

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/menu.css">
    <link rel="stylesheet" href="./css/game.css">
    <link rel="stylesheet" href="./css/shop.css">
    <link rel="stylesheet" href="./css/apartment.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>

<div id="app">

    <!-- =====================================================
         MAIN MENU
    ====================================================== -->

    <section id="menu" class="screen active">

        <!-- Night city background -->
        <div class="city-sky"></div>

        <!-- Decorative neon lights -->
        <div class="menu-neon n1"></div>
        <div class="menu-neon n2"></div>

        <div class="menu-content">

            <!-- Logo -->
            <div class="logo">
                GAME<span>ReP</span>
            </div>

            <div class="tagline">
                FROM ZERO TO THE STAGE
            </div>

            <!-- Main buttons -->
            <div id="menuButtons" class="menu-buttons">

                <button
                    type="button"
                    data-action="new"
                >
                    ▶ НОВАЯ ИГРА
                </button>

                <button
                    type="button"
                    data-action="continue"
                >
                    ▶ ПРОДОЛЖИТЬ
                </button>

                <button
                    type="button"
                    data-action="collection"
                >
                    ▶ КОЛЛЕКЦИЯ
                </button>

                <button
                    type="button"
                    data-action="settings"
                >
                    ▶ НАСТРОЙКИ
                </button>

            </div>

            <!-- MET200$ -->
            <button
                id="metButton"
                class="met-button"
                type="button"
            >
                MET200$
            </button>

            <div class="teaser">
                НОВЫЙ АЛЬБОМ — 9 СЕНТЯБРЯ!
            </div>

        </div>

    </section>


    <!-- =====================================================
         CHARACTER NAME SCREEN
    ====================================================== -->

    <section
        id="nameScreen"
        class="screen modal-screen"
    >

        <div class="panel name-panel">

            <div class="small-label">
                НОВАЯ ИСТОРИЯ
            </div>

            <h1>
                Как тебя зовут?
            </h1>

            <input
                id="nameInput"
                type="text"
                maxlength="18"
                autocomplete="off"
                placeholder="Твоё имя"
            >

            <button
                id="nameContinue"
                class="primary"
                type="button"
            >
                ПРОДОЛЖИТЬ
            </button>

        </div>

    </section>


    <!-- =====================================================
         MAIN GAME
    ====================================================== -->

    <section
        id="gameScreen"
        class="screen"
    >

        <!-- =================================================
             CANVAS
        ================================================== -->

        <canvas
            id="gameCanvas"
        ></canvas>


        <!-- =================================================
             HUD
        ================================================== -->

        <div id="hud">

            <!-- LEFT HUD -->
            <div class="hud-left">

                <!-- Health -->
                <div id="hearts"></div>

                <!-- Music Energy -->
                <div class="music-bar">

                    <span>
                        🎵 MUSIC
                    </span>

                    <div>
                        <i id="musicFill"></i>
                    </div>

                </div>

            </div>


            <!-- RIGHT HUD -->
            <div class="hud-right">

                <!-- Money -->
                <div id="moneyHud">
                    ₽ 0
                </div>

                <!-- Chapter -->
                <div id="chapterHud">
                    ГЛАВА 1
                </div>

            </div>

        </div>


        <!-- =================================================
             INTERACTION HINT
        ================================================== -->

        <div
            id="interactionHint"
        ></div>


        <!-- =================================================
             BOSS HUD
        ================================================== -->

        <div
            id="bossHud"
            class="hidden"
        >

            <div id="bossName">
                BOSS
            </div>

            <div class="boss-bar">

                <i id="bossFill"></i>

            </div>

            <div id="bossPhase">
                PHASE 1
            </div>

        </div>


        <!-- =================================================
             QUEST HUD
        ================================================== -->

        <div id="questHud"></div>


        <!-- =================================================
             TOAST / FLOATING TEXT
        ================================================== -->

        <div id="toastLayer"></div>


        <!-- =================================================
             MOBILE CONTROLS
        ================================================== -->

        <div
            id="mobileControls"
            class="hidden"
        >

            <!-- Virtual joystick -->
            <div id="joystick">

                <div></div>

            </div>


            <!-- Action buttons -->
            <div class="mobile-actions">

                <button
                    type="button"
                    data-key="j"
                >
                    J
                </button>

                <button
                    type="button"
                    data-key="k"
                >
                    ♪
                </button>

                <button
                    type="button"
                    data-key="shift"
                >
                    DASH
                </button>

                <button
                    type="button"
                    data-key="space"
                >
                    JUMP
                </button>

            </div>

        </div>

    </section>


    <!-- =====================================================
         GLOBAL OVERLAY
    ====================================================== -->

    <div
        id="overlay"
        class="overlay hidden"
    ></div>


    <!-- =====================================================
         PAUSE MENU
    ====================================================== -->

    <section
        id="pauseScreen"
        class="screen modal-screen hidden"
    >

        <div class="panel pause-panel">

            <div class="small-label">
                GAMEReP
            </div>

            <h1>
                ПАУЗА
            </h1>


            <button
                type="button"
                data-pause="resume"
            >
                ПРОДОЛЖИТЬ
            </button>


            <button
                type="button"
                data-pause="map"
            >
                КАРТА
            </button>


            <button
                type="button"
                data-pause="inventory"
            >
                ИНВЕНТАРЬ
            </button>


            <button
                type="button"
                data-pause="apartment"
            >
                КВАРТИРА
            </button>


            <button
                type="button"
                data-pause="settings"
            >
                НАСТРОЙКИ
            </button>


            <button
                type="button"
                data-pause="save"
            >
                СОХРАНИТЬ
            </button>


            <button
                type="button"
                data-pause="menu"
            >
                ВЫЙТИ В МЕНЮ
            </button>

        </div>

    </section>


    <!-- =====================================================
         UNIVERSAL PANEL
         
         Используется для:
         - магазина
         - коллекции
         - инвентаря
         - квартиры
         - стриминга
         - карты
         - настроек
         - результатов босса
    ====================================================== -->

    <section
        id="panelScreen"
        class="screen modal-screen hidden"
    >

        <div
            id="panelContent"
            class="panel large-panel"
        >

        </div>

    </section>

</div>


<!-- =========================================================
     GAME JAVASCRIPT
     
     ВАЖНО:
     Используется ES Module.
     Поэтому main.js подключается через type="module".
========================================================== -->

<script
    type="module"
    src="./js/main.js"
></script>


</body>
</html>
