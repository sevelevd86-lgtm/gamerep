<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#090b13"
    >

    <title>GAMEReP</title>

    <!-- Основные стили -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/menu.css">
    <link rel="stylesheet" href="./css/game.css">
    <link rel="stylesheet" href="./css/shop.css">
    <link rel="stylesheet" href="./css/apartment.css">
    <link rel="stylesheet" href="./css/responsive.css">

    <!-- Дополнительные исправления -->
    <link rel="stylesheet" href="./css/fixes.css">
</head>

<body>

<div id="app">

    <!-- =====================================================
         ГЛАВНОЕ МЕНЮ
    ====================================================== -->

    <section
        id="menu"
        class="screen active"
    >

        <div class="city-sky"></div>

        <div class="menu-neon n1"></div>
        <div class="menu-neon n2"></div>

        <div class="menu-content">

            <div class="logo">
                GAME<span>ReP</span>
            </div>

            <div class="tagline">
                FROM ZERO TO THE STAGE
            </div>

            <div
                id="menuButtons"
                class="menu-buttons"
            >

                <button
                    type="button"
                    data-action="new"
                >
                    ▶ НОВАЯ ИГРА
                </button>

                <button
                    type="button"
                    data-action="continue"
                >
                    ▶ ПРОДОЛЖИТЬ
                </button>

                <button
                    type="button"
                    data-action="collection"
                >
                    ▶ КОЛЛЕКЦИЯ
                </button>

                <button
                    type="button"
                    data-action="settings"
                >
                    ▶ НАСТРОЙКИ
                </button>

            </div>

            <button
                id="metButton"
                class="met-button"
                type="button"
            >
                MET200$
            </button>

            <div class="teaser">
                НОВЫЙ АЛЬБОМ — 9 СЕНТЯБРЯ!
            </div>

        </div>

    </section>


    <!-- =====================================================
         СОЗДАНИЕ ПЕРСОНАЖА

         ВАЖНО:
         hidden добавлен специально.
         Этот экран НЕ должен появляться поверх меню
         при запуске игры.
    ====================================================== -->

    <section
        id="nameScreen"
        class="screen modal-screen hidden"
    >

        <div class="panel name-panel">

            <div class="small-label">
                НОВАЯ ИСТОРИЯ
            </div>

            <h1>
                Как тебя зовут?
            </h1>

            <input
                id="nameInput"
                type="text"
                maxlength="18"
                autocomplete="off"
                placeholder="Твоё имя"
            >

            <button
                id="nameContinue"
                class="primary"
                type="button"
            >
                ПРОДОЛЖИТЬ
            </button>

        </div>

    </section>


    <!-- =====================================================
         ИГРОВОЙ ЭКРАН
    ====================================================== -->

    <section
        id="gameScreen"
        class="screen"
    >

        <canvas
            id="gameCanvas"
        ></canvas>


        <!-- =================================================
             HUD
        ================================================== -->

        <div id="hud">

            <div class="hud-left">

                <div id="hearts"></div>

                <div class="music-bar">

                    <span>
                        🎵 MUSIC
                    </span>

                    <div>
                        <i id="musicFill"></i>
                    </div>

                </div>

            </div>


            <div class="hud-right">

                <div id="moneyHud">
                    ₽ 0
                </div>

                <div id="chapterHud">
                    ГЛАВА 1
                </div>

            </div>

        </div>


        <!-- =================================================
             ПОДСКАЗКА ВЗАИМОДЕЙСТВИЯ
        ================================================== -->

        <div
            id="interactionHint"
        ></div>


        <!-- =================================================
             BOSS HUD
        ================================================== -->

        <div
            id="bossHud"
            class="hidden"
        >

            <div id="bossName">
                BOSS
            </div>

            <div class="boss-bar">

                <i id="bossFill"></i>

            </div>

            <div id="bossPhase">
                PHASE 1
            </div>

        </div>


        <!-- =================================================
             QUEST HUD
        ================================================== -->

        <div id="questHud"></div>


        <!-- =================================================
             FLOATING TEXT
        ================================================== -->

        <div id="toastLayer"></div>


        <!-- =================================================
             МОБИЛЬНОЕ УПРАВЛЕНИЕ
        ================================================== -->

        <div
            id="mobileControls"
            class="hidden"
        >

            <div id="joystick">

                <div></div>

            </div>


            <div class="mobile-actions">

                <button
                    type="button"
                    data-key="j"
                >
                    J
                </button>

                <button
                    type="button"
                    data-key="k"
                >
                    ♪
                </button>

                <button
                    type="button"
                    data-key="shift"
                >
                    DASH
                </button>

                <button
                    type="button"
                    data-key="space"
                >
                    JUMP
                </button>

            </div>

        </div>

    </section>


    <!-- =====================================================
         ГЛОБАЛЬНЫЙ OVERLAY
    ====================================================== -->

    <div
        id="overlay"
        class="overlay hidden"
    ></div>


    <!-- =====================================================
         МЕНЮ ПАУЗЫ
    ====================================================== -->

    <section
        id="pauseScreen"
        class="screen modal-screen hidden"
    >

        <div class="panel pause-panel">

            <div class="small-label">
                GAMEReP
            </div>

            <h1>
                ПАУЗА
            </h1>

            <button
                type="button"
                data-pause="resume"
            >
                ПРОДОЛЖИТЬ
            </button>

            <button
                type="button"
                data-pause="map"
            >
                КАРТА
            </button>

            <button
                type="button"
                data-pause="inventory"
            >
                ИНВЕНТАРЬ
            </button>

            <button
                type="button"
                data-pause="apartment"
            >
                КВАРТИРА
            </button>

            <button
                type="button"
                data-pause="settings"
            >
                НАСТРОЙКИ
            </button>

            <button
                type="button"
                data-pause="save"
            >
                СОХРАНИТЬ
            </button>

            <button
                type="button"
                data-pause="menu"
            >
                ВЫЙТИ В МЕНЮ
            </button>

        </div>

    </section>


    <!-- =====================================================
         УНИВЕРСАЛЬНОЕ ОКНО

         Используется для:
         - магазина
         - коллекции
         - инвентаря
         - квартиры
         - стримов
         - карты
         - настроек
         - результатов босса
    ====================================================== -->

    <section
        id="panelScreen"
        class="screen modal-screen hidden"
    >

        <div
            id="panelContent"
            class="panel large-panel"
        ></div>

    </section>

</div>


<!-- =========================================================
     ОСНОВНОЙ JAVASCRIPT
========================================================== -->

<script
    type="module"
    src="./js/main.js"
></script>

</body>

</html>
