<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090b13">
  <title>GAMEReP</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/menu.css">
  <link rel="stylesheet" href="./css/game.css">
  <link rel="stylesheet" href="./css/shop.css">
  <link rel="stylesheet" href="./css/apartment.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <link rel="stylesheet" href="./css/fixes.css">
</head>
<body>
  <div id="app">
    <div id="menu" class="screen active">
      <div class="city-sky"></div>
      <div class="menu-neon n1"></div><div class="menu-neon n2"></div>
      <div class="menu-content">
        <div class="logo">GAME<span>ReP</span></div>
        <div class="tagline">FROM ZERO TO THE STAGE</div>
        <div id="menuButtons" class="menu-buttons">
          <button data-action="new">▶ НОВАЯ ИГРА</button>
          <button data-action="continue">▶ ПРОДОЛЖИТЬ</button>
          <button data-action="character">▶ ВЫБРАТЬ ПЕРСОНАЖА</button>
          <button data-action="collection">▶ КОЛЛЕКЦИЯ</button>
          <button data-action="settings">▶ НАСТРОЙКИ</button>
        </div>
        <button id="metButton" class="met-button">MET200$</button>
        <div class="teaser">НОВЫЙ АЛЬБОМ — 9 СЕНТЯБРЯ!</div>
      </div>
    </div>

    <div id="nameScreen" class="screen modal-screen hidden">
      <div class="panel name-panel">
        <div class="small-label">НОВАЯ ИСТОРИЯ</div>
        <h1>Как тебя зовут?</h1>
        <input id="nameInput" maxlength="18" autocomplete="off" placeholder="Твоё имя">
        <button id="nameContinue" class="primary">ДАЛЬШЕ</button>
      </div>
    </div>

    <div id="characterScreen" class="screen modal-screen hidden">
      <div class="panel character-panel">
        <div class="small-label">GAMEReP CAST</div>
        <h1>ВЫБЕРИ ПЕРСОНАЖА</h1>
        <p class="character-subtitle">Персонаж сохраняется и используется в игре.</p>
        <div id="characterGrid" class="character-grid"></div>
        <div class="character-footer"><span id="characterSelected">Выбран: REP-01</span><button id="characterConfirm" class="primary">ИГРАТЬ</button></div>
      </div>
    </div>

    <div id="gameScreen" class="screen">
      <canvas id="gameCanvas"></canvas>
      <div id="hud">
        <div class="hud-left">
          <div id="hearts"></div>
          <div class="music-bar"><span>🎵 MUSIC</span><div><i id="musicFill"></i></div></div>
        </div>
        <div class="hud-right">
          <div id="moneyHud">₽ 0</div>
          <div id="chapterHud">ГЛАВА 1</div>
          <div id="questHud"></div>
        </div>
      </div>
      <div id="interactionHint"></div>
      <div id="bossHud" class="hidden">
        <div id="bossName">BOSS</div>
        <div class="boss-bar"><i id="bossFill"></i></div>
        <div id="bossPhase">PHASE 1</div>
      </div>
      <div id="toastLayer"></div>
      <div id="mobileControls" class="hidden">
        <div class="mobile-move">
          <button data-key="a">A</button><button data-key="w">W</button><button data-key="d">D</button>
        </div>
        <div class="mobile-actions">
          <button data-key="e">E</button><button data-key="j">J</button><button data-key="k">♪</button>
          <button data-key="shift">DASH</button><button data-key="q">Q</button>
        </div>
      </div>
    </div>

    <div id="overlay" class="overlay hidden"></div>

    <div id="pauseScreen" class="screen modal-screen hidden">
      <div class="panel pause-panel">
        <div class="small-label">GAMEReP</div><h1>ПАУЗА</h1>
        <button data-pause="resume">ПРОДОЛЖИТЬ</button>
        <button data-pause="map">КАРТА</button>
        <button data-pause="inventory">ИНВЕНТАРЬ</button>
        <button data-pause="apartment">КВАРТИРА</button>
        <button data-pause="settings">НАСТРОЙКИ</button>
        <button data-pause="save">СОХРАНИТЬ</button>
        <button data-pause="menu">ВЫЙТИ В МЕНЮ</button>
      </div>
    </div>

    <div id="panelScreen" class="screen modal-screen hidden">
      <div id="panelContent" class="panel large-panel"></div>
    </div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
